services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: healthcare_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-healthcare-super-secret-key-change-in-production-12345
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=healthcare_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=600
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
