[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py *_test.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = 
    -v
    --tb=short
markers =
    django_db: mark test as requiring django database
    unit: mark test as pure in-memory unit test
